<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathe 9 II · Schulaufgaben-Trainingscamp</title><style>:root{--red:#b52543;--dark:#292333;--soft:#fff1f3;--bg:#faf8f8;--green:#147b55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font-family:'Century Gothic','Trebuchet MS',Arial,sans-serif;line-height:1.55}header{background:linear-gradient(115deg,#92233c,#dc5570);color:white;padding:30px max(18px,calc((100vw - 900px)/2));}header h1{margin:0;font-size:clamp(24px,4vw,37px)}header p{margin:7px 0 0}.wrap{max-width:900px;margin:22px auto;padding:0 16px 40px}.panel{background:white;border:1px solid #eadde0;border-radius:19px;padding:clamp(18px,3vw,30px);box-shadow:0 7px 25px #4d17200c}.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;align-items:center}.pill{background:var(--soft);color:#9a2440;border-radius:99px;padding:6px 13px;font-size:14px;font-weight:bold}.progress{height:12px;border-radius:15px;background:#f0e7e9;overflow:hidden;margin:18px 0 24px}.progress>div{height:100%;background:var(--red);width:0%;transition:width .3s}.topic{color:var(--red);font-weight:bold;font-size:14px;letter-spacing:.04em;text-transform:uppercase}.question{font-size:clamp(19px,3vw,25px);font-weight:bold;margin:10px 0 15px}.context{background:#f9f5f6;padding:15px 18px;border-radius:12px;border-left:4px solid #d96780;margin:13px 0 20px}.context strong{color:#92233c}.entry{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0}.entry label{font-weight:bold}input{font:inherit;border:2px solid #d8c8ce;border-radius:9px;padding:11px 13px;min-width:0;width:min(100%,280px);background:white}input:focus{outline:3px solid #efc4cf;border-color:var(--red)}button{font:inherit;font-weight:bold;border:0;border-radius:10px;padding:12px 17px;cursor:pointer}button.primary{background:var(--red);color:white}button.secondary{background:#f5e7eb;color:#83203a}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:19px}.feedback{min-height:40px;margin-top:17px;font-weight:bold}.good{color:var(--green)}.bad{color:#b52543}.hint,.solution{background:#fff5e5;border-left:4px solid #d69a2c;padding:12px 15px;margin:13px 0;border-radius:8px}.solution{background:#eaf7ef;border-color:#21865d}.hidden{display:none}.small{font-size:14px;color:#675d65}.end{text-align:center}.end h2{font-size:29px;color:var(--red)}.stats{font-size:22px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0}.tile{background:#faf2f4;padding:13px;border-radius:11px}.tile b{display:block;color:#8d233c}footer{text-align:center;color:#776a72;font-size:13px;margin-top:22px}kbd{font-family:inherit;background:#eee;padding:2px 5px;border-radius:4px}@media print{header{background:#fff;color:#000}.actions{display:none}.panel{box-shadow:none}}</style></head><body><header><h1>🎯 Mathe 9 II · SA-Trainingscamp</h1><p>Gesamtwiederholung: Lineare Funktionen · Nullstellen · Dreiecksflächen · Determinante</p></header><main class="wrap"><div class="panel" id="game"><div class="top"><span class="pill" id="counter">Aufgabe 1 von 16</span><span class="pill" id="score">⭐ 0 richtig</span></div><div class="progress"><div id="bar"></div></div><div class="topic" id="topic"></div><div class="question" id="question"></div><div class="context" id="context"></div><div class="entry"><label for="answer" id="answerLabel">Deine Antwort:</label><input id="answer" autocomplete="off" spellcheck="false" placeholder="Ergebnis eingeben"></div><div class="small" id="format"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="hidden" id="hint"></div><div class="hidden" id="solution"></div><div class="actions"><button class="primary" id="check">✓ Überprüfen</button><button class="secondary" id="hintBtn">💡 Tipp</button><button class="secondary" id="solutionBtn">👀 Lösung zeigen</button><button class="primary hidden" id="next">Weiter →</button></div></div><footer>Schulaufgaben-Vorbereitung · Alle Aufgaben werden bei jeder Runde neu erzeugt. Komma oder Punkt als Dezimaltrennzeichen möglich.</footer></main><script>
const $=id=>document.getElementById(id);let tasks=[],idx=0,correct=0,attempted=false,solved=false,categoryStats={};
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const nonzero=(a,b)=>{let v;do{v=r(a,b)}while(!v);return v};const fmt=n=>String(Math.round(n*10000)/10000).replace('.',',');const sgn=n=>n<0?`− ${fmt(-n)}`:`+ ${fmt(n)}`;const line=(m,t)=>`y = ${m===1?'x':m===-1?'−x':fmt(m)+'x'} ${sgn(t)}`;const norm=s=>s.toLowerCase().replace(/\s/g,'').replace(/[−–]/g,'-').replace(/,/g,'.').replace(/·|\*/g,'').replace(/\(|\)/g,'').replace(/^y=/,'').replace(/^a\(x\)=/,'');const close=(a,b)=>Math.abs(a-b)<.0001;const number=s=>{let x=norm(s).replace(/\|/g,'');if(/^[-+]?\d+(\.\d+)?\/[-+]?\d+(\.\d+)?$/.test(x)){let [a,b]=x.split('/').map(Number);return b? a/b:NaN}return Number(x)};const numcheck=(v,n)=>v.trim()!==''&&close(number(v),n);
function exprCheck(v,m,b){let x=norm(v).replace(/\|/g,'');if(!x)return false; // accept mx+b in conventional notation, including omitted coefficient 1
 let match=x.match(/^([+-]?(?:\d+(?:\.\d+)?)?)x([+-]\d+(?:\.\d+)?)?$/);if(!match)return false;let a=match[1];let mm=a===''||a==='+'?1:a==='-'?-1:Number(a);let bb=match[2]?Number(match[2]):0;return close(mm,m)&&close(bb,b)}
function vectorCheck(v,a,b){let x=norm(v).replace(/[\[\]{}]/g,'').split(/[;\/]/);return x.length===2&&numcheck(x[0],a)&&numcheck(x[1],b)}
function add(topic,question,context,answer,check,hint,solution,format='Zahlen mit Komma oder als Bruch eingeben.') {tasks.push({topic,question,context,answer,check,hint,solution,format})}
function build(){tasks=[];let m=nonzero(-5,5),t=r(-7,7);add('1 · Grundlagen','Lies die Steigung m ab.',`Gegeben ist die Gerade <strong>${line(m,t)}</strong>.`,'m = ?',v=>numcheck(v,m),'Bei y = mx + t steht m direkt vor dem x.',`m = ${fmt(m)}`);add('1 · Grundlagen','Bestimme den y-Achsenabschnitt t.',`Gegeben ist die Gerade <strong>${line(m,t)}</strong>.`,'t = ?',v=>numcheck(v,t),'t ist die Zahl ohne x.',`t = ${fmt(t)}`);
 let x1=r(-4,0),dx=r(1,5),ym=nonzero(-4,4),y1=r(-5,5),x2=x1+dx,y2=y1+ym*dx;add('2 · Steigung','Berechne die Steigung der Geraden durch zwei Punkte.',`P(${x1} | ${y1}) und Q(${x2} | ${y2})`,'m = ?',v=>numcheck(v,ym),`m = (y₂ − y₁) / (x₂ − x₁).`,`m = (${y2} − (${y1})) / (${x2} − (${x1})) = ${fmt(ym)}`);
 let m2=nonzero(-4,4),t2=r(-5,5),px=r(-3,3),py=m2*px+t2;add('2 · Geradengleichung','Bestimme die Funktionsgleichung.',`Die Gerade hat die Steigung m = ${m2} und verläuft durch P(${px} | ${py}).`,'y = ?',v=>exprCheck(v,m2,t2),'Setze P in y = mx + t ein und berechne t.',`y = ${fmt(m2)}x ${sgn(t2)}.`, 'Gib nur den Term ein, z. B. 2x-3.');
 let m3=nonzero(-5,5),root=r(-5,5),t3=-m3*root;add('3 · Nullstellen','Berechne die Nullstelle.',`f(x) = ${fmt(m3)}x ${sgn(t3)}`,'x₀ = ?',v=>numcheck(v,root),'Setze f(x) = 0 und löse nach x auf.',`0 = ${fmt(m3)}x ${sgn(t3)} ⇒ x₀ = ${fmt(root)}`);
 let xx=r(-4,4),mm=nonzero(-4,4),tt=r(-5,5);add('3 · Funktionswerte','Berechne den Funktionswert.',`f(x) = ${fmt(mm)}x ${sgn(tt)}. Berechne f(${xx}).`,'f(x) = ?',v=>numcheck(v,mm*xx+tt),'Setze die angegebene Zahl für x ein.',`f(${xx}) = ${mm} · (${xx}) ${sgn(tt)} = ${fmt(mm*xx+tt)}`);
 let xpt=r(-4,4),mpt=nonzero(-3,3),tpt=r(-5,5),yp=mpt*xpt+tpt;add('3 · Punktprobe','Liegt der Punkt auf der Geraden?',`g: ${line(mpt,tpt)}<br>P(${xpt} | ${yp+r(1,3)})`,'Ja / Nein',v=>['nein','n','no'].includes(norm(v)),'Setze die x-Koordinate in die Gleichung ein und vergleiche den y-Wert.',`Nein. Bei x = ${xpt} ist y = ${yp}.`,'Schreibe Ja oder Nein.');
 let am=nonzero(-4,4),bm=nonzero(-4,4);while(bm===am)bm=nonzero(-4,4);let ix=r(-3,3),ay=r(-4,4),at=ay-am*ix,bt=ay-bm*ix;add('4 · Schnittpunkte','Bestimme die x-Koordinate des Schnittpunkts.',`g: ${line(am,at)}<br>h: ${line(bm,bt)}`,'x = ?',v=>numcheck(v,ix),'Setze beide Funktionsgleichungen gleich.',`${fmt(am)}x ${sgn(at)} = ${fmt(bm)}x ${sgn(bt)} ⇒ x = ${ix}`);add('4 · Schnittpunkte','Bestimme die y-Koordinate des Schnittpunkts.',`g: ${line(am,at)}<br>h: ${line(bm,bt)}`,'y = ?',v=>numcheck(v,ay),'Setze die gefundene x-Koordinate in eine der Geraden ein.',`S(${ix} | ${ay}), also y = ${ay}`);
 let A={x:r(-3,1),y:r(-3,2)},B={x:0,y:0};let vx=r(2,6),vy=r(-3,3);B.x=A.x+vx;B.y=A.y+vy;let c=r(-3,3),d=r(-4,4),cx=r(-2,4),cy=c*cx+d;add('5 · Vektoren','Berechne den Vektor AB.',`A(${A.x} | ${A.y}), B(${B.x} | ${B.y})`,'AB = ?',v=>vectorCheck(v,vx,vy),'Endpunkt minus Anfangspunkt: B − A.',`AB = (${vx}; ${vy})`,'Schreibe beide Komponenten als x;y, z. B. 4;2.');add('5 · Vektoren','Berechne den Vektor AC für einen festen Punkt C.',`A(${A.x} | ${A.y}), C(${cx} | ${cy})`,'AC = ?',v=>vectorCheck(v,cx-A.x,cy-A.y),'C − A: Ziehe die Koordinaten einzeln ab.',`AC = (${cx-A.x}; ${cy-A.y})`,'Schreibe beide Komponenten als x;y, z. B. 4;2.');
 let det=vx*(cy-A.y)-vy*(cx-A.x),area=Math.abs(det)/2;add('6 · Determinante','Berechne die Determinante.',`AB = (${vx}; ${vy}), AC = (${cx-A.x}; ${cy-A.y})`,'D = ?',v=>numcheck(v,det),'D = ABₓ · ACᵧ − ABᵧ · ACₓ.',`D = ${vx} · (${cy-A.y}) − (${vy}) · (${cx-A.x}) = ${det}`);add('6 · Flächeninhalt','Berechne den Flächeninhalt des Dreiecks.',`Die Determinante beträgt D = ${det}.`,'A = ?',v=>numcheck(v,area),'A = ½ · |D|. Ein Flächeninhalt ist nie negativ.',`A = ½ · |${det}| = ${fmt(area)} FE`);
 // variable point chosen so determinant is nonnegative in the stated x range
 let ax=r(-3,1),ay2=r(-3,2),base=r(2,6),h=r(1,4),slope=r(1,3),offset=r(1,5),lo=r(0,2); // C(x | slope*x + offset), A(ax|ay2), B(ax+base|ay2), area = base/2*abs(slope*x+offset-ay2)
 let zero=(ay2-offset)/slope;let interval=slope>0?`x ≥ ${fmt(Math.ceil(zero))}`:`x ≤ ${fmt(Math.floor(zero))}`;let k=base*slope/2,b=base*(offset-ay2)/2;let goodSlope=k,goodB=b; // Im angegebenen Bereich ist die Hoehe nichtnegativ
 add('7 · Funktionale Abhängigkeit','Stelle die Flächenfunktion A(x) auf.',`A(${ax} | ${ay2}), B(${ax+base} | ${ay2}), C(x | ${slope===1?'x':slope===-1?'−x':fmt(slope)+'x'} ${sgn(offset)}).<br><strong>Betrachte nur ${interval}.</strong>`,'A(x) = ?',v=>exprCheck(v,goodSlope,goodB),'Die Grundseite AB ist waagerecht. A = ½ · Grundseite · Höhe. Beachte den angegebenen x-Bereich.',`A(x) = ${fmt(goodSlope)}x ${sgn(goodB)} (für ${interval}).`,'Gib nur den Term ohne Betragsstriche ein, z. B. 3x-6.');
 let targetX=slope>0?Math.ceil(zero)+r(1,3):Math.floor(zero)-r(1,3),targetArea=goodSlope*targetX+goodB;add('7 · Funktionale Abhängigkeit','Für welchen x-Wert hat das Dreieck den angegebenen Flächeninhalt?',`Es gilt A(x) = ${fmt(goodSlope)}x ${sgn(goodB)} für ${interval}.<br>Gesucht: A(x) = ${fmt(targetArea)} FE.`,'x = ?',v=>numcheck(v,targetX),'Setze die Fläche für A(x) ein und löse die Gleichung nach x auf.',`${fmt(targetArea)} = ${fmt(goodSlope)}x ${sgn(goodB)} ⇒ x = ${fmt(targetX)}`);
 let g=r(2,8),height=r(2,8);add('8 · Transfer','Ein Dreieck hat eine waagerechte Grundseite. Berechne seinen Flächeninhalt.',`Grundseite g = ${g} LE, Höhe h = ${height} LE.`,'A = ?',v=>numcheck(v,g*height/2),'A = ½ · g · h.',`A = ½ · ${g} · ${height} = ${fmt(g*height/2)} FE`);
}
function render(){if(idx>=tasks.length){end();return}let q=tasks[idx];$('counter').textContent=`Aufgabe ${idx+1} von ${tasks.length}`;$('score').textContent=`⭐ ${correct} richtig`;$('bar').style.width=`${idx/tasks.length*100}%`;$('topic').textContent=q.topic;$('question').textContent=q.question;$('context').innerHTML=q.context;$('answer').value='';$('answer').disabled=false;$('answerLabel').textContent=q.answer;$('format').textContent=q.format;$('feedback').textContent='';$('feedback').className='feedback';$('hint').className='hidden';$('solution').className='hidden';$('check').disabled=false;$('hintBtn').disabled=false;$('solutionBtn').disabled=false;$('next').classList.add('hidden');attempted=false;solved=false;$('answer').focus()}
function reveal(which){let q=tasks[idx],el=$(which);el.className=which==='hint'?'hint':'solution';el.textContent=(which==='hint'?'💡 ':'✓ ')+(which==='hint'?q.hint:q.solution);if(which==='solution'){solved=true;$('check').disabled=true;$('answer').disabled=true;$('next').classList.remove('hidden');$('feedback').textContent='Lösung angesehen – weiter zur nächsten Aufgabe.';$('feedback').className='feedback'}}
$('check').onclick=()=>{if(solved)return;let v=$('answer').value,q=tasks[idx];if(!v.trim()){$('feedback').textContent='Bitte gib zuerst eine Antwort ein.';return}if(q.check(v)){solved=true;correct++;$('feedback').textContent='✓ Richtig! Sehr gut!';$('feedback').className='feedback good';$('check').disabled=true;$('answer').disabled=true;$('next').classList.remove('hidden');$('score').textContent=`⭐ ${correct} richtig`}else{$('feedback').textContent='Noch nicht richtig. Versuche es erneut oder nutze einen Tipp.';$('feedback').className='feedback bad'}};$('hintBtn').onclick=()=>reveal('hint');$('solutionBtn').onclick=()=>reveal('solution');$('next').onclick=()=>{idx++;render()};$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){if(!$('next').classList.contains('hidden'))$('next').click();else $('check').click()}});
function end(){$('bar').style.width='100%';$('game').innerHTML=`<div class="end"><div style="font-size:56px">🏆</div><h2>Trainingscamp geschafft!</h2><p>Du hast alle ${tasks.length} Aufgaben bearbeitet.</p><p class="stats">⭐ ${correct} von ${tasks.length} direkt richtig gelöst</p><div class="grid"><div class="tile"><b>Lineare Funktionen</b>Steigung · Gleichung · Nullstellen</div><div class="tile"><b>Geraden</b>Punktprobe · Schnittpunkte</div><div class="tile"><b>Dreiecke</b>Vektoren · Determinante · Fläche</div><div class="tile"><b>Funktionale Abhängigkeit</b>Flächenfunktion · x berechnen</div></div><p>${correct>=14?'Super vorbereitet!':correct>=10?'Gut geübt! Wiederhole die Aufgaben, bei denen du noch unsicher warst.':'Bleib dran! Eine weitere Runde hilft dir, sicherer zu werden.'}</p><button class="primary" onclick="location.reload()">🔄 Neue Trainingsrunde mit neuen Zahlen</button><p class="small">Tipp: Rechne jede Aufgabe zuerst auf Papier und trage dann das Ergebnis ein.</p></div>`}
const params=new URLSearchParams(location.search);const section=params.get('thema')||'alle';
const topics={grundlagen:['1 ·'],geraden:['2 ·'],nullstellen:['3 · Nullstellen','3 · Funktionswerte'],punktprobe:['3 · Punktprobe','4 ·'],vektoren:['5 ·'],flaechen:['6 ·'],abhaengigkeit:['7 ·'],transfer:['8 ·']};
const names={alle:'Schulaufgaben-Training',grundlagen:'Grundlagen linearer Funktionen',geraden:'Steigung & Geradengleichung',nullstellen:'Nullstellen & Funktionswerte',punktprobe:'Punktprobe & Schnittpunkte',vektoren:'Seitenvektoren',flaechen:'Determinante & Dreiecksflächen',abhaengigkeit:'Funktionale Abhängigkeit',transfer:'Transferaufgaben'};
const originalBuild=build;
build=function(){let pool=[];for(let i=0;i<(section==='alle'?1:4);i++){originalBuild();pool.push(...tasks.filter(q=>section==='alle'||(topics[section]||[]).some(prefix=>q.topic.startsWith(prefix))))}tasks=pool;};
const title=names[section]||names.alle;document.title='Mathe 9 II · '+title;
const heading=document.querySelector('h1');if(heading)heading.textContent=title;
const nav=document.createElement('nav');nav.className='portalnav';nav.innerHTML='<a href="index.html">⌂ Alle Themen</a><a href="training.html?thema=alle">🏆 Gesamtwiederholung</a><a href="determinante-schrittweise.html">📐 Determinante Schritt für Schritt</a>';
document.body.insertBefore(nav,document.body.firstChild);
const extra=document.createElement('style');extra.textContent='.portalnav{display:flex;gap:10px;flex-wrap:wrap;background:#fff;padding:13px max(16px,calc((100vw - 1080px)/2));border-bottom:1px solid #eed3d8}.portalnav a{color:#9b1735;text-decoration:none;font-weight:700;border:1px solid #eed3d8;border-radius:10px;padding:9px 13px}.portalnav a:hover{background:#fff0f3}';document.head.append(extra);
// Rerun produces fresh questions without page reload and retains the chosen topic.
window.neueRunde=()=>{build();idx=0;correct=0;document.getElementById('game').outerHTML=originalGame;render()};
const originalGame=document.getElementById('game').outerHTML;
build();render();
</script></body></html>
